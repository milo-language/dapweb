<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three frames of a call stack, indented, in the memory view's region
       colours. Three bars survive 16px in a way a glyph does not. -->
  <rect width="32" height="32" rx="7" fill="#161b22"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="5"  y="7.5"  width="22" height="5" rx="2" fill="#79c0ff"/>
  <rect x="7.5" y="14.5" width="19.5" height="5" rx="2" fill="#f778ba"/>
  <rect x="10" y="21.5" width="17" height="5" rx="2" fill="#3fb950"/>
</svg>
