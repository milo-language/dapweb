<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The memory view's region colours (stack, heap, code, const, data), which
       is the one picture in this app nobody else in the space has. Five bars
       survive 16px in a way a glyph does not; the tall one is the stack, where a
       debugger spends its life. -->
  <rect width="32" height="32" rx="7" fill="#161b22"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <rect x="5"  y="9"  width="3.6" height="15" rx="1.6" fill="#3fb950"/>
  <rect x="10" y="11" width="3.6" height="11" rx="1.6" fill="#f778ba"/>
  <rect x="15" y="6"  width="3.6" height="21" rx="1.6" fill="#79c0ff"/>
  <rect x="20" y="11" width="3.6" height="11" rx="1.6" fill="#56d4dd"/>
  <rect x="25" y="9"  width="3.6" height="15" rx="1.6" fill="#ff9e64"/>
</svg>
