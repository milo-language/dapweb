name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # dapweb breaks from commits to the COMPILER, not to dapweb, so a
  # push-triggered gate alone would not have caught the std coherence
  # overhaul that broke this build. Run nightly against milo main too.
  schedule:
    - cron: "0 7 * * *"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      # Build against milo MAIN, deliberately NOT the released tarball that
      # release.yml pins. A pinned release can only tell us dapweb still works
      # with the compiler of the day, and the breakage class this gate exists
      # for is a stdlib change on milo main, which a pinned binary hides until
      # after the next milo release ships. Releases keep using the pin; this
      # job is the early-warning one.
      - uses: actions/checkout@v4
        with:
          repository: milo-language/milo
          path: .milo-src
      - name: install milo deps
        working-directory: .milo-src
        run: bun install --frozen-lockfile

      # milo needs clang 16+ (its IR uses element-type-free intrinsic mangling),
      # and 22.04 ships 15. lldb-dap is the DAP adapter every e2e suite drives;
      # apt names it lldb-dap-N, dapweb probes bare `lldb-dap` on PATH.
      #
      # 22, not 18: lldb-dap 18 never answers readMemory, and 21 refuses
      # setVariable on a scope container it just enumerated ("could not find
      # variable in scope"). Both are adapter-side and no dapweb change fixes
      # them, so the gate could not pass for reasons that had nothing to do with
      # this repo. 22 is what the developers here run, so the gate now fails only
      # for real reasons.
      - name: install clang + lldb 22
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y lldb-22
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++
          sudo ln -sf /usr/bin/lldb-dap-22 /usr/bin/lldb-dap
          clang --version | head -1
          lldb-dap --help > /dev/null && echo "lldb-dap runs"

      - name: install openssl headers
        run: sudo apt-get install -y libssl-dev

      # The UI bundle needs its own deps; scripts/build.sh builds the bundle and
      # then the binary that embeds it.
      - name: install ui deps
        working-directory: src/web/ui
        run: bun install --frozen-lockfile

      # Also run by build.sh; called out here so a type error reports as its own
      # failed step instead of as "the build broke".
      - name: typecheck ui
        working-directory: src/web/ui
        run: bunx tsc --noEmit

      - name: build
        run: MILO=.milo-src/src/main.ts scripts/build.sh

      - name: gates
        run: scripts/test.sh

      # Best-effort: a failure before the suites run leaves no logs, and the glob
      # failing to match must not add a second, misleading error to the run.
      - name: server logs on failure
        if: failure()
        run: |
          shopt -s nullglob
          for f in /tmp/dapweb_test_*.log; do echo "── $f"; tail -40 "$f"; done
          exit 0
